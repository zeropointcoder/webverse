<form [formGroup]="registerForm" (ngSubmit)="register()">
    <h1>Employee Registration Form</h1>
    <div class="mb-3">
        <div id="userHelp" class="form-text mb-3">We'll never share your personal details with anyone else.</div>
        <label for="username" class="form-label">Username</label>
        <input formControlName="username" type="text" class="form-control" id="username" placeholder="Username" aria-describedby="userHelp" />
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input formControlName="email" type="email" class="form-control" id="email" placeholder="Email" aria-describedby="userHelp" />
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input formControlName="password" type="password" class="form-control" id="password" placeholder="Password" aria-describedby="userHelp" />
    </div>
    <button type="submit" class="btn btn-sm btn-danger">Register</button>
</form>

<p class="my-3">
    Already have an account? <a routerLink="/login">Login here</a>
</p>
