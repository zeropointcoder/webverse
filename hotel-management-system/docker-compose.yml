services:
    db:
        image: postgres:16
        environment:
            POSTGRES_DB: hotel_management
            POSTGRES_USER: hotel_user
            POSTGRES_PASSWORD: local_dev_password
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U hotel_user -d hotel_management"]
            interval: 5s
            timeout: 5s
            retries: 5

    api:
        build: .
        ports:
            - "8000:8000"
        environment:
            DATABASE_URL: postgresql+psycopg2://hotel_user:local_dev_password@db:5432/hotel_management
        depends_on:
            db:
                condition: service_healthy

volumes:
    postgres_data:
