services:
    db:
        image: postgres:16
        environment:
            POSTGRES_DB: hotel_management
            POSTGRES_USER: hotel_user
            POSTGRES_PASSWORD: local_dev_password
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U hotel_user -d hotel_management"]
            interval: 5s
            timeout: 5s
            retries: 5

    migrate:
        build: .
        command: python -m alembic upgrade head
        environment:
            DATABASE_URL: postgresql+psycopg2://hotel_user:local_dev_password@db:5432/hotel_management
        depends_on:
            db:
                condition: service_healthy


    api:
        build: .
        image: zeropointcoder/hotel-management-system:${APP_VERSION:-1.0.1}
        ports:
            - "8000:8000"
        environment:
            DATABASE_URL: postgresql+psycopg2://hotel_user:local_dev_password@db:5432/hotel_management
        depends_on:
            db:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully

    prometheus:
        image: prom/prometheus:v3.5.0
        ports:
            - "9090:9090"
        volumes:
            - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        depends_on:
            - api

    grafana:
        image: grafana/grafana:12.0.2
        ports:
            - "3000:3000"
        volumes:
            - grafana_data:/var/lib/grafana
        depends_on:
            - prometheus
            

volumes:
    postgres_data:
    grafana_data:
