apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-prometheus
  labels:
    app: hotel-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-prometheus
  template:
    metadata:
      labels:
        app: hotel-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
              readOnly: true
      volumes:
        - name: prometheus-config
          configMap:
            name: hotel-prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-prometheus
spec:
  type: ClusterIP
  selector:
    app: hotel-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http