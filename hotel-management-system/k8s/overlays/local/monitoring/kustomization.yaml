apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - prometheus.yaml
  - grafana.yaml
  - grafana-provisioning.yaml

configMapGenerator:
  - name: hotel-prometheus-config
    files:
      - config/prometheus.yml
  - name: hotel-grafana-dashboard
    files:
      - config/hotel-api.json

generatorOptions:
  disableNameSuffixHash: true