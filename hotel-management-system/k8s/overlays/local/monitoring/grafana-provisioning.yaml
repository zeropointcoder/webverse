apiVersion: v1
kind: ConfigMap
metadata:
  name: hotel-grafana-datasource
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://hotel-prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hotel-grafana-dashboard-provider
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: Hotel API
        orgId: 1
        folder: Hotel Management
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards/hotel-api