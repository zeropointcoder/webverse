apiVersion: batch/v1
kind: Job
metadata:
  name: hotel-db-migration
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: hotel-db-migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: zeropointcoder/hotel-management-system:1.0.1
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - alembic
            - upgrade
            - head
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hotel-management-local-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
